title: demo-leave-manager-review
description: Manager approval screen for leave requests
type: FORM
config:
  - name: Page 1
    order: 1
    items:
      - uuid: 6ba7b811-9dad-11d1-80b4-00c04fd430c8
        component: VueComponentRenderTemplate
        editor-component: VueComponentEditor
        editor-control: VueComponentEditor
        label: Manager review
        inspector: []
        config:
          icon: fa-palette
          interactive: true
          componentName: LeaveManagerReview
          contentVue: "<LeaveManagerReview v-model=\"data\" :submit=\"submit\" />"
          handlerVue: |
            return {
              created() {
                if (!this.data) {
                  return;
                }
                if (this.data.managerDecision === undefined) {
                  this.$set(this.data, 'managerDecision', '');
                }
                if (this.data.managerComments === undefined) {
                  this.$set(this.data, 'managerComments', '');
                }
              },
            };
          components:
            - name: LeaveManagerReview
              key: "@/projects/demoLeave/managerReview/LeaveManagerReview.vue"
          renderVarHtml: null
          ignoreMustache: true
computed: []
watchers: []
custom_css: null

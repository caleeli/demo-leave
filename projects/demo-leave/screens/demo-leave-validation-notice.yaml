title: demo-leave-validation-notice
description: Shows validation errors before resubmitting a leave request
type: DISPLAY
config:
  - name: Page 1
    order: 1
    items:
      - uuid: 6ba7b813-9dad-11d1-80b4-00c04fd430c8
        component: VueComponentRenderTemplate
        editor-component: VueComponentEditor
        editor-control: VueComponentEditor
        label: Validation notice
        inspector: []
        config:
          icon: fa-palette
          interactive: false
          componentName: LeaveValidationNotice
          contentVue: "<LeaveValidationNotice v-model=\"data\" />"
          handlerVue: |
            return {
              created() {
                if (!this.data) {
                  return;
                }
                if (this.data.validationErrors === undefined) {
                  this.$set(this.data, 'validationErrors', []);
                }
              },
            };
          components:
            - name: LeaveValidationNotice
              key: "@/projects/demoLeave/validationNotice/LeaveValidationNotice.vue"
          renderVarHtml: null
          ignoreMustache: true
computed: []
watchers: []
custom_css: null
